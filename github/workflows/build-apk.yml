name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Installa dipendenze
        run: npm install

      - name: 🏗️ Compila Web App
        run: npm run build

      - name: 🚀 Configura Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: 🔔 Inserisci permessi notifiche Android
        run: |
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml

      - name: 🛠️ Compila APK Debug con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Carica APK negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MemoCorsi-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          

name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del codice
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Installazione Dipendenze
        run: npm install

      - name: 🏗️ Compilazione Web
        run: npm run build

      - name: 🚀 Creazione Progetto Android e Permessi Notifiche
        run: |
          npx cap add android
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: 🛠️ Compilazione APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📤 Caricamento APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoCorsi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
